version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hermes_os
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${HERMES_DB_PASSWORD:-hermes_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes -d hermes_os"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${HERMES_REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    environment:
      - IS_PERSISTENT=TRUE
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8000:8000"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  hermes-backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    environment:
      HERMES_DB_HOST: postgres
      HERMES_DB_PORT: "5432"
      HERMES_DB_NAME: hermes_os
      HERMES_DB_USER: hermes
      HERMES_DB_PASSWORD: ${HERMES_DB_PASSWORD:-hermes_secret}
      HERMES_REDIS_HOST: redis
      HERMES_REDIS_PORT: "6379"
      HERMES_REDIS_PASSWORD: ${HERMES_REDIS_PASSWORD:-redis_secret}
      HERMES_VECTOR_HOST: chromadb
      HERMES_VECTOR_PORT: "8000"
      HERMES_JWT_SECRET: ${HERMES_JWT_SECRET:-change_me_in_production}
      HERMES_API_PORT: "8000"
      HERMES_API_HOST: "0.0.0.0"
      HERMES_FRONTEND_URL: "http://localhost:3000"
      HERMES_LOG_LEVEL: INFO
      HERMES_GPU_ENABLED: "true"
      HERMES_DEFAULT_MODEL: ${HERMES_DEFAULT_MODEL:-llama3.2:3b}
      HERMES_MEMORY_LIMIT: "8192"
    volumes:
      - hermes_workspace:/app/workspace
      - hermes_data:/app/data
      - hermes_logs:/app/logs
      - hermes_backups:/app/backups
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  hermes-frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - hermes-backend
    restart: unless-stopped

  monitoring:
    image: prom/prometheus:latest
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  ollama_data:
  hermes_workspace:
  hermes_data:
  hermes_logs:
  hermes_backups:
  prometheus_data:
