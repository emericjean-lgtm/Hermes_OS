[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# ── Les deux repertoires, pas un seul (HOS-111) ──────────────────────────
#
# `testpaths` ne declarait que backend/tests. tests/ en contient 2 869 de
# plus — architecture, API, integrations, securite, production — soit 71 %
# du depot, que ni la CI ni personne n'executait. Le ROADMAP le signalait
# sous M-9 depuis le 30 juillet.
#
# Ce qui s'y cachait n'etait pas du bruit : 33 tests rouges, dont un vrai
# defaut fonctionnel (trois types d'evenements rattaches a aucune
# categorie, donc invisibles pour tout ce qui regroupe), une doublure de
# test divergee de la signature du vrai moteur Aegis — quatre tests de la
# porte de securite echouaient sur un TypeError au lieu de verifier la
# securite — et un renommage de modeles que la moitie visible du depot
# n'avait pas vu passer.
testpaths = backend/tests tests

# ── Les tests lents sont nommes, pas caches ──────────────────────────────
#
# tests/integration lance le pipeline autonome complet avec de l'inference
# reelle : un seul de ces tests peut prendre plusieurs minutes. Les inclure
# dans la boucle courte la rendrait inutilisable, et les retirer de
# testpaths recreerait exactement l'angle mort qu'on vient de fermer.
#
# Ils sont donc marques `lent` (voir tests/integration/conftest.py) et
# deselectionnes par defaut. Pour les executer :
#     pytest -m lent
# Pour tout executer :
#     pytest -m ""
# ── Un test qui pend doit echouer, pas attendre (HOS-112) ────────────────
#
# Deux executions de la suite se sont figees sans jamais rendre de
# verdict : 92 minutes pour l'une, 15 pour l'autre, en consommant
# respectivement 58 et 12 secondes de CPU. Elles n'echouaient pas — elles
# attendaient une inference qui ne revenait pas.
#
# C'est le pendant de la regle du projet : on ne croit pas un succes sur
# parole, mais une suite qui ne se termine pas ne dit rien du tout, et son
# silence ressemble a du travail en cours. Un delai de garde transforme ce
# silence en echec nomme, avec la pile de l'endroit exact ou ca bloque.
#
# 60 s est tres au-dessus de tout test sain de la boucle courte : le plus
# lent apres correction tient en 2 s.
timeout = 60

addopts = -m "not lent"
markers =
    lent: exige une inference reelle et plusieurs minutes — hors boucle courte
