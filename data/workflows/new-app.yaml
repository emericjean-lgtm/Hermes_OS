id: new-app
name: New App — spec, scaffold, tests, verification
description: >
  Turns a one-line app idea into a written spec, a reviewed code
  scaffold, a test suite, an actual test run, and a Kronos backlog item —
  with human validation gates before anything touches disk.

  Scope, stated honestly. The workflow now closes §8's "Compilation →
  Tests" chain: `verify` really executes the generated suite through the
  §16 verification runner. But at the shipped `autonomy_level: low`, that
  runner returns `ran: false` with `require_human_validation` on every
  call — by design (config/security.yaml's verification_run). So out of
  the box this workflow writes an app, writes tests for it, and *reports
  that it was not allowed to run them*. Raising autonomy to "high" is the
  deliberate act that turns the last step into a real test run. Either
  way the outcome is written into the backlog item, so "nobody ran this"
  never silently passes for "it works".

  Every file write is doubly gated: a human_validation pause in the
  engine, then Aegis's own file_write verdict against ALLOWED_PATHS.

  `review_code` and `scaffold_tests` both depend only on `scaffold`, so
  they form one parallel wave (§6) — check with
  POST /workflows/new-app/simulate, whose execution_waves shows it.

  Before running, edit: the app idea in `spec.brief`, and the output
  paths. Paths must sit inside ALLOWED_PATHS (currently the hermes-ollama
  repo itself) — to generate into your own project folder instead, add it
  to ALLOWED_PATHS in .env first. The `verify` runner is `pytest`; change
  it if the generated stack isn't Python (see
  GET /verification/runners for the whitelist).

nodes:
  # 1. Scribe turns the idea into a spec. This is the node to edit.
  - id: spec
    action: write_document
    params:
      brief: >
        Write a short technical spec for this application: a small web app
        to track personal reading — add a book, mark it as reading or
        finished, list what's in progress. Cover, in this order: the
        feature list, the data model, the chosen stack and why, and the
        API surface. Be concrete and brief; no marketing copy, no
        alternatives section.
      format: markdown
      tone: neutral

  # 2. Veritas checks the spec before any code is derived from it —
  #    a contradiction here would otherwise propagate into the scaffold.
  - id: review_spec
    action: verify_output
    params:
      output: "$steps.spec.document"
      context: >
        A technical spec for a small application, about to be used as the
        sole input for generating a code scaffold.
      criteria:
        - "Is the data model complete enough to implement from?"
        - "Does any feature lack a corresponding API endpoint?"
        - "Are there internal contradictions between sections?"

  # 3. HUMAN GATE — nothing has touched disk before this point.
  - id: save_spec
    action: files_apply
    human_validation: true
    params:
      path: "./data/generated/new-app/SPEC.md"
      new_content: "$steps.spec.document"

  # 4. Scribe writes the scaffold from the approved spec.
  - id: scaffold
    action: write_document
    params:
      brief: >
        Write the starter implementation for the application described in
        the context. Single runnable file, standard library plus one web
        framework at most, with the data model and every endpoint from the
        spec present. Include a short docstring at the top saying how to
        run it. Output only the code.
      format: python
      tone: neutral
      context: "$steps.spec.document"

  # 5. Veritas reviews the generated code. Its `corrections` feed the
  #    backlog item below, so a flawed scaffold leaves a written trace
  #    rather than being silently accepted.
  - id: review_code
    action: verify_output
    params:
      output: "$steps.scaffold.document"
      context: >
        A first code scaffold generated from the approved spec, not yet
        executed or tested by anyone.
      criteria:
        - "Would this run as-is, or are there missing imports/definitions?"
        - "Does it implement every endpoint the spec lists?"
        - "Is any error handling or input validation obviously absent?"

  # 6. Scribe writes the test suite. Depends only on `scaffold`, exactly
  #    like review_code — so the two run as one parallel wave (§6).
  - id: scaffold_tests
    action: write_document
    params:
      brief: >
        Write a pytest suite for the application in the context. One file,
        importable without starting a server: test the data model and each
        endpoint's logic directly. Cover the nominal path and at least one
        error case per endpoint. No network calls, no sleeps. Output only
        the code.
      format: python
      tone: neutral
      context: "$steps.scaffold.document"

  # 7. SECOND HUMAN GATE — review the diff before the code lands.
  - id: save_code
    action: files_apply
    human_validation: true
    params:
      path: "./data/generated/new-app/app.py"
      new_content: "$steps.scaffold.document"

  # 8. THIRD HUMAN GATE — same treatment for the tests. A generated test
  #    file is still generated code landing on disk.
  - id: save_tests
    action: files_apply
    human_validation: true
    params:
      path: "./data/generated/new-app/test_app.py"
      new_content: "$steps.scaffold_tests.document"

  # 9. Actually run the suite (§16 / §8's "Tests" step).
  #    At the shipped autonomy_level: low this returns ran=false with
  #    require_human_validation instead of executing — that is the
  #    designed default, not a failure. Its whole output feeds the
  #    backlog item below, so the distinction between "tests passed",
  #    "tests failed" and "nobody was allowed to run them" is recorded
  #    rather than assumed.
  - id: verify
    action: verification_run
    params:
      repo_path: "./data/generated/new-app"
      runner: pytest

  # 10. Veritas's findings AND the verification outcome become a real
  #     Kronos task, so whatever is left undone is tracked, not
  #     remembered.
  - id: backlog
    action: tasks_create
    params:
      title: "Finish the generated app: run it, fix what the review and the test run found"
      description: "$steps.review_code.corrections"
      objective: >
        Close the gaps Veritas listed, and act on the verification result
        recorded in this run — including the case where the test run was
        refused because autonomy is set to low.
      priority: high

  # 11. Run summary.
  - id: report
    action: write_document
    params:
      brief: >
        Summarize this app-generation run in under 15 lines: what was
        specified, what the code review concluded, whether the test suite
        actually ran (and what it returned), and what a human still has to
        do. If the run was refused for lack of autonomy, say so plainly
        rather than implying the code is verified.
      format: markdown
      context: "$steps.review_code.corrections"

edges:
  - from: spec
    to: review_spec
  - from: review_spec
    to: save_spec
    condition: on_success
  - from: save_spec
    to: scaffold
    condition: on_success
  # Both fan out from `scaffold` and depend on nothing else, so the
  # engine puts them in one wave and runs them concurrently (§6).
  - from: scaffold
    to: review_code
  - from: scaffold
    to: scaffold_tests

  - from: review_code
    to: save_code
    condition: on_success
  - from: scaffold_tests
    to: save_tests
    condition: on_success

  # `verify` waits on both writes: running the suite before the tests
  # landed would test the previous run's files, or nothing at all.
  - from: save_code
    to: verify
    condition: on_success
  - from: save_tests
    to: verify
    condition: on_success

  # `always`, not `on_success`: a refused or failing verification is
  # exactly what the backlog item needs to record.
  - from: verify
    to: backlog
    condition: always
  - from: backlog
    to: report
    condition: always
