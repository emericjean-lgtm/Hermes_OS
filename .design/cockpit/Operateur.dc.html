<!doctype html>

<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>

<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: transparent; }
    a { color: #ff9436; } a:hover { color: #ffc93d; }

    /* ── L'opérateur ──────────────────────────────────────────────────
       Aplats pleins, contours épais : le registre de la réclame
       américaine des années 50, pas le fil de fer technique.

       Trois règles apprises en le dessinant, chacune après l'avoir vu
       rater à l'écran :

       * Les membres sont des tubes tracés deux fois — une passe sombre
         large qui fait le contour, une passe claire plus fine par-dessus.
         Ils doivent sortir de la silhouette du torse, sinon ils s'y
         fondent et le personnage n'a plus de bras.
       * La tête fait un tiers de la hauteur. En dessous, le registre
         bascule vers la figurine technique.
       * Les objets tenus sont en négatif — fond sombre, contour clair —
         l'inverse du corps. Dessinés comme lui, ils se lisaient comme un
         motif de vêtement. Et ils se tiennent à l'écart de la tête : une
         loupe à hauteur d'oreille se confondait avec la coque du casque.

       L'identité est d'Hermès et non d'ailleurs : le casque d'opérateur
       porte les petites ailes du pétase, l'attribut du messager. */

    .o-tr { fill: none; stroke: var(--ombre); stroke-width: 27; stroke-linecap: round; stroke-linejoin: round; }
    .o-tp { fill: none; stroke: var(--corps); stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
    .o-f  { fill: var(--corps); stroke: var(--ombre); stroke-width: 4.5; stroke-linejoin: round; }
    .o-d  { fill: var(--ombre); }
    .o-l  { fill: none; stroke: var(--ombre); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .o-lf { fill: none; stroke: var(--ombre); stroke-width: 2.6; stroke-linecap: round; }

    /* Les objets tenus, en négatif du corps. */
    .o-p  { fill: var(--ombre); stroke: var(--corps); stroke-width: 4.5; stroke-linejoin: round; }
    .o-pl { fill: none; stroke: var(--corps); stroke-width: 3; stroke-linecap: round; opacity: 0.72; }

    /* Le phosphore : une lueur portée par le personnage lui-même, pas par
       un cadre. C'est ce qui lui permet de tenir sur le fond sans boîte. */
    .o-svg { filter: drop-shadow(0 0 8px color-mix(in srgb, var(--corps) 40%, transparent)); }

    /* ══ BOUCLES ══════════════════════════════════════════════════════
       Chaque posture est une boucle complète : un geste qui commence, se
       déroule et revient exactement à son point de départ, de sorte
       qu'elle puisse tourner aussi longtemps que la tâche dure sans
       jamais montrer de couture.

       Deux contraintes ont façonné ce qui suit :

       * Une seule animation par élément. Deux règles qui animent toutes
         deux `transform` sur le même nœud s'écrasent — le tremblement et
         l'affaissement de « débordement » sont donc écrits dans une seule
         image-clé, pas superposés.
       * Rien de nerveux, sauf l'alerte. Ceci se regarde du coin de l'œil
         pendant des heures ; un mouvement qui appelle sans cesse le
         regard finit par être masqué du regard. L'alerte, elle, doit
         justement le voler. */

    /* Repos — respiration lente et report du poids d'un pied sur l'autre.
       Un système à l'arrêt doit avoir l'air à l'arrêt. */
    .a-repos { animation: repos 7.6s ease-in-out infinite; transform-origin: 105px 272px; }
    @keyframes repos {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25%      { transform: translateY(-2px) rotate(0deg); }
      50%      { transform: translateY(0) rotate(1.3deg); }
      75%      { transform: translateY(-2px) rotate(1.3deg); }
    }

    .a-souffle { animation: souffle 3.8s ease-in-out infinite; transform-origin: 105px 272px; }
    @keyframes souffle { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-2px) scaleY(1.007); } }

    /* Lancement — le pouce monte, le corps rebondit à l'instant où il
       arrive. Les deux boucles font 2,6 s pour rester en phase. */
    .a-pouce { animation: pouce 2.6s cubic-bezier(0.16, 1, 0.3, 1) infinite; transform-origin: 138px 152px; }
    @keyframes pouce { 0%, 12% { transform: rotate(32deg); } 26%, 78% { transform: rotate(0deg); } 92%, 100% { transform: rotate(32deg); } }

    .a-rebond { animation: rebond 2.6s cubic-bezier(0.16, 1, 0.3, 1) infinite; transform-origin: 105px 272px; }
    @keyframes rebond {
      0%, 14%   { transform: translateY(0); }
      26%       { transform: translateY(-6px); }
      36%       { transform: translateY(0); }
      41%       { transform: translateY(-2px); }
      48%, 100% { transform: translateY(0); }
    }

    /* Réflexion — le doigt tapote le menton, les engrenages tournent. */
    .a-tapote { animation: tapote 1.7s ease-in-out infinite; transform-origin: 138px 152px; }
    @keyframes tapote { 0%, 58%, 100% { transform: rotate(0deg); } 70% { transform: rotate(-4deg); } 82% { transform: rotate(0deg); } }

    .a-rouages   { animation: tourne 4.6s linear infinite; transform-origin: 168px 34px; }
    .a-rouages-b { animation: tourne-inv 3.1s linear infinite; transform-origin: 199px 12px; }
    @keyframes tourne { to { transform: rotate(360deg); } }
    @keyframes tourne-inv { to { transform: rotate(-360deg); } }

    /* Lecture — la ligne descend, la tête suit le texte, la page vacille
       une fois en fin de course : elle vient d'être lue. */
    .a-balaye { animation: balaye 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes balaye { 0% { opacity: 0; transform: translateY(0); } 12%, 82% { opacity: 1; } 100% { opacity: 0; transform: translateY(56px); } }

    .a-lit { animation: lit 2.4s ease-in-out infinite; transform-origin: 105px 129px; }
    @keyframes lit { 0%, 100% { transform: rotate(-2.4deg); } 50% { transform: rotate(2.4deg); } }

    .a-page { animation: page 2.4s linear infinite; }
    @keyframes page { 0%, 86% { opacity: 1; } 90% { opacity: 0.3; } 95%, 100% { opacity: 1; } }

    /* Écriture — trois lignes se tracent l'une après l'autre puis la
       feuille se vide d'un coup. C'est la boucle la plus proche d'un gif :
       elle raconte quelque chose et recommence.

       Les trois décalages sont écrits dans les images-clés et non par
       `animation-delay` : avec un délai, chaque ligne tournerait sur son
       propre cycle et elles ne se videraient jamais ensemble. */
    .a-ecrit { animation: ecrit 1.2s ease-in-out infinite; transform-origin: 138px 152px; }
    @keyframes ecrit { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(7deg); } }

    .a-ligne-1, .a-ligne-2, .a-ligne-3 { stroke-dasharray: 64; }
    .a-ligne-1 { animation: ligne1 3.6s linear infinite; }
    .a-ligne-2 { animation: ligne2 3.6s linear infinite; }
    .a-ligne-3 { animation: ligne3 3.6s linear infinite; }
    @keyframes ligne1 { 0% { stroke-dashoffset: 64; } 22%, 88% { stroke-dashoffset: 0; } 91%, 100% { stroke-dashoffset: 64; } }
    @keyframes ligne2 { 0%, 26% { stroke-dashoffset: 64; } 48%, 88% { stroke-dashoffset: 0; } 91%, 100% { stroke-dashoffset: 64; } }
    @keyframes ligne3 { 0%, 52% { stroke-dashoffset: 64; } 74%, 88% { stroke-dashoffset: 0; } 91%, 100% { stroke-dashoffset: 64; } }

    /* Vérification — la loupe balaie, et un reflet la traverse à chaque
       arrêt : c'est ce reflet qui dit qu'elle regarde. */
    .a-fouille { animation: fouille 3.2s ease-in-out infinite; transform-origin: 138px 152px; }
    @keyframes fouille { 0%, 100% { transform: rotate(0deg); } 30% { transform: rotate(-16deg); } 65% { transform: rotate(11deg); } }

    .a-reflet { animation: reflet 3.2s ease-in-out infinite; }
    @keyframes reflet {
      0%, 22%   { opacity: 0; transform: translateX(-13px); }
      34%       { opacity: 0.9; transform: translateX(0); }
      46%, 58%  { opacity: 0; transform: translateX(13px); }
      59%       { opacity: 0; transform: translateX(-13px); }
      72%       { opacity: 0.9; transform: translateX(0); }
      84%, 100% { opacity: 0; transform: translateX(13px); }
    }

    /* Tests — les coches tombent une à une, puis la liste se vide. */
    .a-coche-1 { animation: coche1 3.6s steps(1) infinite; }
    .a-coche-2 { animation: coche2 3.6s steps(1) infinite; }
    .a-coche-3 { animation: coche3 3.6s steps(1) infinite; }
    @keyframes coche1 { 0%, 17% { opacity: 0; } 18%, 88% { opacity: 1; } 89%, 100% { opacity: 0; } }
    @keyframes coche2 { 0%, 41% { opacity: 0; } 42%, 88% { opacity: 1; } 89%, 100% { opacity: 0; } }
    @keyframes coche3 { 0%, 65% { opacity: 0; } 66%, 88% { opacity: 1; } 89%, 100% { opacity: 0; } }

    .a-aiguille { animation: tourne 3.6s linear infinite; transform-origin: 0px -28px; }

    /* Réussite — un saut, franc et court. */
    .a-saute { animation: saute 1.35s cubic-bezier(0.3, 0, 0.2, 1) infinite; }
    @keyframes saute { 0%, 58%, 100% { transform: translateY(0); } 22% { transform: translateY(-17px); } 38% { transform: translateY(-4px); } }

    /* Chargement — les poids montent dans la caisse, puis elle se vide et
       ça recommence. La barre est la progression, pas un ornement. */
    .a-porte { animation: porte 4s ease-in-out infinite; }
    @keyframes porte { 0%, 100% { transform: translateY(0); } 46% { transform: translateY(5px); } }

    .a-remplit { animation: remplit 4s cubic-bezier(0.35, 0, 0.65, 1) infinite; transform-origin: 105px 228px; }
    @keyframes remplit { 0% { transform: scaleY(0); } 84%, 92% { transform: scaleY(1); } 94%, 100% { transform: scaleY(0); } }

    /* Débordement — il s'enfonce sous la charge, se reprend d'un sursaut,
       s'enfonce de nouveau. */
    .a-effort { animation: effort 2.6s ease-in-out infinite; }
    @keyframes effort {
      0%   { transform: translate(0, 0); }
      9%   { transform: translate(-1.7px, 2px); }
      18%  { transform: translate(1.7px, 3.5px); }
      27%  { transform: translate(-1.5px, 5px); }
      36%  { transform: translate(1.5px, 6.5px); }
      45%  { transform: translate(-1.7px, 8px); }
      52%  { transform: translate(0, 9px); }
      60%  { transform: translate(0, -2px); }
      68%  { transform: translate(-1.6px, 1px); }
      77%  { transform: translate(1.6px, 2.5px); }
      88%  { transform: translate(-1.5px, 1.5px); }
      100% { transform: translate(0, 0); }
    }

    .a-goutte { animation: goutte 2.6s ease-in infinite; }
    @keyframes goutte { 0%, 10% { opacity: 0; transform: translate(0, -8px); } 26% { opacity: 1; } 62%, 100% { opacity: 0; transform: translate(-7px, 32px); } }

    /* Défaut — le bras désigne le panneau par petits coups. */
    .a-jab { animation: jab 1.6s ease-in-out infinite; transform-origin: 138px 152px; }
    @keyframes jab { 0%, 46%, 100% { transform: rotate(0deg); } 60% { transform: rotate(-8deg); } 74% { transform: rotate(0deg); } }

    .a-battement { animation: battement 1.6s ease-in-out infinite; transform-origin: 184px 96px; }
    @keyframes battement { 0%, 100% { opacity: 0.4; transform: scale(0.95); } 55% { opacity: 1; transform: scale(1.08); } }

    /* Alerte — la seule boucle qui a le droit de voler le regard. */
    .a-agite { animation: agite 0.62s ease-in-out infinite; transform-origin: 105px 268px; }
    @keyframes agite { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

    .a-vague-d { animation: vague 0.62s ease-in-out infinite; transform-origin: 138px 152px; }
    .a-vague-g { animation: vague 0.62s ease-in-out infinite reverse; transform-origin: 72px 152px; }
    @keyframes vague { 0%, 100% { transform: rotate(-11deg); } 50% { transform: rotate(11deg); } }

    .a-eclat { animation: eclat 0.62s steps(1) infinite; }
    @keyframes eclat { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.12; } }

    /* Décision — il tend la planchette, la retient, la retend. */
    .a-tend { animation: tend 2.4s ease-in-out infinite; transform-origin: 105px 240px; }
    @keyframes tend { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.055) translateY(-4px); } }

    .a-cligne { animation: cligne 5.4s steps(1) infinite; transform-origin: 105px 80px; }
    @keyframes cligne { 0%, 95% { transform: scaleY(1); } 96%, 98% { transform: scaleY(0.1); } 99%, 100% { transform: scaleY(1); } }

    @media (prefers-reduced-motion: reduce) {
      .o-svg * { animation: none !important; }
    }
  </style>
</helmet>

<svg class="o-svg" viewBox="0 0 220 300" width="100%" height="100%"
     style="--corps: {{ teinte }}; --ombre: #080a0d; display: block; overflow: visible;"
     role="img" aria-label="Opérateur Hermes — {{ libelle }}">

  <g class="{{ classeCorps }}">

      <path class="o-tp" d="M122,214 L125,254"></path>

        <path class="a-coche-3" d="M49,236 l4,5 l7,-9" fill="none" stroke="var(--corps)" stroke-width="3.4" stroke-linecap="round"></path>

    <sc-if value="{{ aCaisse }}" hint-placeholder-val="{{ false }}">

        <path class="o-pl" d="M56,178 h98 M56,214 h98 M84,162 v68 M126,162 v68"></path>

<script data-dc-script data-props='{"etat":{"editor":"enum","default":"lancement","options":["repos","lancement","reflexion","lecture","ecriture","verification","tests","reussite","chargement","debordement","defaut","alerte","decision"]},"$preview":{"width":220,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    const etat = this.props.etat ?? 'lancement';

    // Chaque état est une posture complète : deux bras, un visage, une
    // boucle et éventuellement un objet. Le tout déclaré ici plutôt que
    // dispersé dans le gabarit — on lit une posture d'un coup.
    //
    // `boucle` est la durée d'un tour complet. Elle est exposée pour que
    // la planche puisse l'afficher : c'est ce chiffre qu'on ajuste quand
    // un geste paraît nerveux ou mou, et il vaut mieux le voir écrit.
    const P = {
      repos: {
        libelle: 'Au repos', teinte: '#8695a6', visage: 'normal', corps: 'a-repos', boucle: '7,6 s',
        bg: 'M72,152 C56,162 50,182 52,196', mg: [52, 202, 0],
        bd: 'M138,152 C154,162 160,182 158,196', md: [158, 202, 0],
      },
      lancement: {
        libelle: 'Tâche lancée', teinte: '#ff9436', visage: 'clin', corps: 'a-rebond', boucle: '2,6 s',
        bg: 'M72,152 C54,160 46,180 58,192', mg: [62, 198, 0],
        bd: 'M138,152 C162,156 172,138 166,118', md: [166, 112, 8], pouceD: true, brasD: 'a-pouce',
      },
      reflexion: {
        libelle: 'Réflexion', teinte: '#ff9436', visage: 'pense', corps: 'a-souffle', boucle: '1,7 s',
        bg: 'M72,152 C54,160 46,180 58,192', mg: [62, 198, 0],
        bd: 'M138,152 C164,162 162,134 140,122', md: [134, 118, -36], brasD: 'a-tapote',
        rouages: true,
      },
      lecture: {
        libelle: 'Lecture du workspace', teinte: '#5eb8e8', visage: 'concentre', corps: 'a-souffle', boucle: '2,4 s',
        bg: 'M72,152 C62,164 56,180 56,190', mg: [56, 196, 0],
        bd: 'M138,152 C148,164 154,180 154,190', md: [154, 196, 0],
        feuille: true, tete: 'a-lit',
      },
      ecriture: {
        libelle: 'Écriture sur disque', teinte: '#ff9436', visage: 'concentre', corps: 'a-souffle', boucle: '3,6 s',
        bg: 'M72,152 C58,166 48,190 48,206', mg: [48, 212, 0],
        bd: 'M138,152 C160,164 148,196 118,202', md: [112, 206, 34], brasD: 'a-ecrit',
        planchette: true,
      },
      verification: {
        libelle: 'Vérification sur disque', teinte: '#ffc93d', visage: 'concentre', corps: 'a-souffle', boucle: '3,2 s',
        bg: 'M72,152 C56,162 50,182 54,196', mg: [56, 202, 0],
        bd: 'M138,152 C158,154 172,146 178,134', md: [180, 130, -6], loupe: true, brasD: 'a-fouille',
      },
      tests: {
        libelle: 'Tests en cours', teinte: '#ff9436', visage: 'concentre', corps: 'a-souffle', boucle: '3,6 s',
        bg: 'M72,152 C56,166 46,192 46,208', mg: [46, 214, 0],
        bd: 'M138,152 C160,152 176,144 184,136', md: [186, 134, 10], chrono: true,
        liste: true,
      },
      reussite: {
        libelle: 'Section vérifiée', teinte: '#9ede3a', visage: 'heureux', corps: 'a-saute', boucle: '1,35 s',
        bg: 'M72,152 C52,136 40,110 36,88', mg: [34, 82, -28],
        bd: 'M138,152 C158,136 170,110 174,88', md: [176, 82, 28],
      },
      chargement: {
        libelle: 'Chargement du modèle', teinte: '#ff9436', visage: 'concentre', corps: 'a-porte', boucle: '4 s',
        bg: 'M72,152 C60,162 54,178 56,188', mg: [56, 194, 0],
        bd: 'M138,152 C150,162 156,178 154,188', md: [154, 194, 0],
        caisse: true,
      },
      debordement: {
        libelle: 'Débordement — chemin CPU', teinte: '#ff5347', visage: 'effort', corps: 'a-effort', boucle: '2,6 s',
        bg: 'M72,152 C54,166 42,192 42,204', mg: [42, 210, 0],
        bd: 'M138,152 C156,166 168,192 168,204', md: [168, 210, 0],
        grosseCaisse: true, gouttes: true,
      },
      defaut: {
        libelle: 'Défaut relevé', teinte: '#ffc93d', visage: 'inquiet', corps: 'a-souffle', boucle: '1,6 s',
        bg: 'M72,152 C54,160 46,180 58,192', mg: [62, 198, 0],
        bd: 'M138,152 C166,156 180,144 184,126', md: [186, 120, 14], brasD: 'a-jab',
        panneau: true,
      },
      alerte: {
        libelle: 'Alerte — session relancée', teinte: '#ff5347', visage: 'inquiet', corps: 'a-agite', boucle: '0,62 s',
        bg: 'M72,152 C50,148 40,124 50,104', mg: [52, 98, -20], brasG: 'a-vague-g',
        bd: 'M138,152 C160,148 170,124 160,104', md: [158, 98, 20], brasD: 'a-vague-d',
        eclats: true,
      },
      decision: {
        libelle: 'Décision attendue', teinte: '#5eb8e8', visage: 'normal', corps: 'a-tend', boucle: '2,4 s',
        bg: 'M72,152 C60,162 54,176 56,186', mg: [56, 192, 0],
        bd: 'M138,152 C150,162 156,176 154,186', md: [154, 192, 0],
        tendu: true,
      },
    };

    const p = P[etat] ?? P.repos;

    // Un engrenage se calcule ; écrit à la main il devient une étoile.
    const engrenage = (cx, cy, rExt, rInt, dents) => {
      const n = dents * 2;
      const pts = [];
      for (let i = 0; i < n; i++) {
        const r = i % 2 === 0 ? rExt : rInt;
        const a = (Math.PI * 2 * i) / n;
        pts.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1));
      }
      return 'M' + pts.join(' L') + ' Z';
    };

    return {
      libelle: p.libelle,
      teinte: p.teinte,
      boucle: p.boucle,
      classeCorps: p.corps ?? '',
      classeTete: p.tete ?? '',
      classeBrasG: p.brasG ?? '',
      classeBrasD: p.brasD ?? '',

      brasG: p.bg, mainGX: p.mg[0], mainGY: p.mg[1], mainGR: p.mg[2],
      brasD: p.bd, mainDX: p.md[0], mainDY: p.md[1], mainDR: p.md[2], pouceD: p.pouceD === true,

      vNormal: p.visage === 'normal',
      vClin: p.visage === 'clin',
      vHeureux: p.visage === 'heureux',
      vConcentre: p.visage === 'concentre',
      vPense: p.visage === 'pense',
      vEffort: p.visage === 'effort',
      vInquiet: p.visage === 'inquiet',

      aFeuille: p.feuille === true,
      aPlanchette: p.planchette === true,
      aListe: p.liste === true,
      aCaisse: p.caisse === true,
      aGrosseCaisse: p.grosseCaisse === true,
      aTendu: p.tendu === true,
      aLoupe: p.loupe === true,
      aChrono: p.chrono === true,
      aRouages: p.rouages === true,
      aGouttes: p.gouttes === true,
      aPanneau: p.panneau === true,
      aEclats: p.eclats === true,

      engrenageA: engrenage(168, 34, 18, 12.5, 8),
      engrenageB: engrenage(199, 12, 12, 8, 6),
    };
  }
}
</script>
