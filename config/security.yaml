# Aegis permission matrix — cahier des charges §17.
#
# One system-wide autonomy level (§13.2 / §26.3): "low" is the safe
# default (everything mutating gets proposed for validation). Raising it
# to "medium"/"high" lets non-mandatory mutating categories auto-allow —
# but categories marked mandatory_validation are NEVER auto-allowed
# regardless of autonomy level, matching the §17.3 list verbatim.
autonomy_level: medium

action_categories:
  # ── Read-only — never blocked by autonomy level, but still confined
  # to ALLOWED_PATHS (§17.1: "accès limité aux dossiers autorisés"). ──
  file_read:
    mutating: false
    path_based: true
    mandatory_validation: false

  # ── Mutating, path-based — gated by whitelist (hard) + autonomy (soft) ──
  file_write:
    mutating: true
    path_based: true
    mandatory_validation: false
    min_autonomy_for_auto_allow: medium

  file_delete:
    mutating: true
    path_based: true
    mandatory_validation: true # §17.3: "suppression de fichiers"

  # A move makes the source path disappear — the same real loss-of-access
  # risk as a delete, so it gets the same mandatory_validation treatment
  # rather than file_write's auto-allow-at-medium-autonomy shape (Workspace
  # Filesystem tool layer, Phase 6: delete/move/overwrite/bulk need review).
  file_move:
    mutating: true
    path_based: true
    mandatory_validation: true

  # Nothing disappears on a copy (unlike move) — same risk shape as
  # creating a new file, so it gets file_write's policy rather than
  # file_move's/file_delete's mandatory review. A distinct category
  # instead of literally reusing file_write so audit/approval entries
  # read as "copy", not as an unrelated write.
  file_copy:
    mutating: true
    path_based: true
    mandatory_validation: false
    min_autonomy_for_auto_allow: medium

  secret_modification:
    mutating: true
    path_based: true
    mandatory_validation: true # §17.3: "modification de secrets / .env"

  # ── Git ──
  git_operation:
    mutating: true
    path_based: false
    mandatory_validation: false
    min_autonomy_for_auto_allow: medium

  git_critical:
    mutating: true
    path_based: false
    mandatory_validation: true # §17.3: reset, force push, merge branche principale

  # ── Infrastructure / system ──
  deployment:
    mutating: true
    path_based: false
    mandatory_validation: true

  data_migration:
    mutating: true
    path_based: false
    mandatory_validation: true

  system_config:
    mutating: true
    path_based: false
    mandatory_validation: true

  system_command:
    mutating: true
    path_based: false
    mandatory_validation: true # §17.1: commandes destructrices interdites par défaut

  # Running a *whitelisted* verification runner (§16: lint / build /
  # tests) from config/verification.yaml. Distinct from system_command
  # because the command is not caller-supplied: the caller names a runner
  # and cannot pass arguments, and the working directory is confined to
  # ALLOWED_PATHS.
  #
  # It is nonetheless `mutating: true` — running a test suite executes the
  # target project's own code and routinely writes (caches, coverage,
  # build output). Marking it non-mutating would make it auto-allowed at
  # every autonomy level, which would be plainly wrong.
  #
  # min_autonomy "high", not "medium": at the shipped autonomy_level of
  # "low" this requires human validation every single time, which is the
  # safe default. Raising autonomy to "high" is how an operator opts into
  # unattended CI-style checks — a deliberate act, not the default.
  verification_run:
    mutating: true
    path_based: true
    mandatory_validation: false
    min_autonomy_for_auto_allow: high

  # ── Network ──
  network_call:
    mutating: true
    path_based: false
    mandatory_validation: false
    min_autonomy_for_auto_allow: high

  network_major:
    mutating: true
    path_based: false
    mandatory_validation: true # §17.3: "actions réseau importantes"

  # OpenRouter cloud-model escalation (HOS-066C) — the first path by which a
  # task's prompt content leaves this machine. Same policy shape as
  # network_call (not mandatory, but gated behind "high") rather than
  # network_major (always human): the request itself is bounded and
  # inspectable (one chat completion to a named free model), not an open
  # network action. At the shipped autonomy_level "low" this still requires
  # human validation every time — nothing is sent automatically out of the
  # box. Raising autonomy_level to "high" is how an operator deliberately
  # opts in to unattended cloud escalation.
  cloud_inference:
    mutating: true
    path_based: false
    mandatory_validation: false
    min_autonomy_for_auto_allow: high

  # Real internet search (Assistant chat, HOS-078) — a query string leaves
  # this machine, same "mutating: true" logic as cloud_inference above. Set
  # lower than cloud_inference's "high" (min "medium") deliberately: unlike
  # a full prompt sent to a cloud model, this sends only a short search
  # query to a public search engine and returns read-only text — a real
  # but smaller exposure. There is no approval UI in a live chat stream
  # (unlike Missions' pause/resume), so at an autonomy level below this
  # threshold the tool call is refused outright with a message the model
  # relays to the user, rather than left hanging on a validation step
  # nothing can complete.
  web_search:
    mutating: true
    path_based: false
    mandatory_validation: false
    min_autonomy_for_auto_allow: medium

  # ── Autonomous Agentic Core (HOS-067) ──
  # Gates whether an autonomous goal (/autonomous/start) is allowed to plan
  # and execute at all. Not path_based here — a goal's own local_path (when
  # bound to one) is checked separately as a plain file_read against
  # ALLOWED_PATHS before this runs; this category is the broader "is
  # autonomous execution itself authorized right now" gate. Individual risky
  # actions a mission's tasks take (file writes, git operations, network
  # calls) are still separately gated by their own categories at the point
  # of use — this does not replace those, it is the outer gate.
  # min_autonomy "medium", not "high": an autonomous goal is not itself an
  # external-egress or destructive action (those remain gated at "high" or
  # mandatory elsewhere) — it is the same class of "mutating, needs a
  # deliberate opt-in" as file_write/git_operation. At the shipped
  # autonomy_level "low" this still requires human validation every time.
  autonomous_goal_execute:
    mutating: true
    path_based: false
    mandatory_validation: false
    min_autonomy_for_auto_allow: medium

  # ── Missions (HOS-068) ──
  # Same policy shape and reasoning as autonomous_goal_execute above,
  # applied to /missions/{id}/start instead — the two entry points share
  # the exact same underlying DAG pipeline, so they share the same gate
  # policy rather than drifting into two different postures for the same
  # class of action.
  mission_execute:
    mutating: true
    path_based: false
    mandatory_validation: false
    min_autonomy_for_auto_allow: medium
