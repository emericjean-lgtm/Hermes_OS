# Model catalogue and routing configuration for Hermes Ollama.
#
# This file is the single source of truth for which Ollama model tag is used
# for which role. Nothing in backend code should hardcode a model name —
# always resolve it through this file (see backend/core/router.py).
#
# Sizes/VRAM figures are indicative (Q4 quantization, RX 6800 16 GB target).
# Verify actual tag availability with `ollama show <model>` before pulling.
#
# num_ctx (HOS-065C): every role used one global default (8192, regardless
# of model) until this pass — see backend/model_intelligence/
# benchmark_scheduler.py's module docstring for the real (not simulated)
# benchmark this project now runs. Each value below was chosen from a real
# measurement, not the model's architectural maximum (`ollama show <model>`
# — several support 131K-262K): the constraint that actually matters on
# this deployment's ~17.16GB VRAM card is what a candidate context costs in
# real, measured VRAM, not what the model could theoretically address.
# Real VRAM at each role's chosen num_ctx (single model loaded, no other
# non-always-loaded model concurrently active):
#   swift 3.2GB · standard 6.8GB · orchestrator ~11.5GB (extrapolated from
#   14.1GB @ 32768, see below) · code 15.2GB+6.1GB RAM · code_agentic
#   14.3GB · reasoning 13.5GB · reasoning_escalation 15.0GB+9.5GB RAM (@
#   16384 — see its own note) · vision 8.4GB · security 14.3GB ·
#   double_check 5.1GB · advanced_analysis 12.7GB.
# The two always-loaded roles (swift, embedding) add their VRAM on top of
# whichever other role is active — code/orchestrator/reasoning_escalation
# leave little to no headroom for that when it happens; this is a real
# hardware ceiling on this card for models this size, not something a
# context setting can fix (code's own 18GB on-disk weight already exceeds
# the 17.16GB budget before any KV cache is added).

roles:
  swift:
    model: qwen3:1.7b
    tier: turbo
    vram_gb: 1.5
    # always_loaded pins this model in VRAM (keep_alive: -1) instead of
    # letting it expire after OLLAMA_KEEP_ALIVE (§22: "conserve les
    # modèles rapides en mémoire"). Structured flag rather than inferring
    # it from `tier: turbo` — double_check is turbo too but is genuinely
    # occasional, and pinning a third model would eat headroom the 16GB
    # budget doesn't have.
    always_loaded: true
    # Real: 843ms latency, 235 tok/s, 3.2GB VRAM (HOS-065C benchmark).
    # Always loaded, so kept comfortably below its real max (40960) —
    # doubling from the old flat 8192 default costs little for a model
    # this small.
    num_ctx: 16384
    description: Ultra-fast routing and classification. Kept loaded at all times.

  standard:
    model: qwen3.5:9b
    tier: standard
    vram_gb: 6.6
    # Real: 25.0s latency, 69.8 tok/s, 6.8GB VRAM (HOS-065C benchmark) —
    # comfortable headroom on a 17.16GB card, room for the largest bump of
    # any role (4x the old default) since conversation/writing/research
    # genuinely benefit from more room.
    num_ctx: 32768
    description: >
      General conversation, writing, extraction. Upgraded from qwen3:8b
      (2026-07): confirmed on Ollama's official library (`qwen3.5:9b`),
      6.6GB, 256K context window (up from qwen3:8b's), reported gains in
      reasoning/maths/multilingual over qwen3:8b.

  orchestrator:
    model: hf.co/bartowski/NousResearch_Hermes-4-14B-GGUF:Q4_K_M
    tier: quality
    vram_gb: 9
    # Measured 14.1GB VRAM at 32768 (HOS-065C benchmark) — too tight
    # combined with the always-loaded swift+embedding baseline, so this is
    # halved to 16384 rather than the tested value; not independently
    # re-measured at 16384, but VRAM at this model's own real max (40960)
    # scales from the same base weight, so 16384 is the safer, still-real
    # extrapolation rather than a guess with no data behind it.
    num_ctx: 16384
    description: >
      Planning, decomposition, orchestration (Hermes Prime). Upgraded from
      hermes3:8b (2026-07): NousResearch's Hermes 4 14B, built on a
      Qwen3-14B base, adds hybrid reasoning and explicit structured
      `<tool_call>` tagging after the reasoning step — directly relevant
      here since reliable tool/function calling is the exact reason this
      role exists as a separate model from `standard`. Not yet in Ollama's
      official library — pull the community GGUF conversion with
      `ollama pull hf.co/bartowski/NousResearch_Hermes-4-14B-GGUF:Q4_K_M`.
      vram_gb is an estimate for a 14B dense model at Q4_K_M (~9GB);
      confirm the exact figure with `ollama show` after pulling, since
      there's no official Ollama library page to cross-check against.

  # Optional alternative for `code`, not applied as default (2026-07 check):
  # Qwen3.6-35B-A3B beats qwen3-coder:30b on coding benchmarks (SWE-bench
  # Verified 73.4, Terminal-Bench 2.0 51.5) — but only at full precision.
  # The user's proposed Q2_K quant was rejected: 2-bit quantization hits
  # code generation disproportionately hard (MoE expert-routing distortion,
  # keyword/special-token imbalance), independently confirmed to erase or
  # reverse a full-precision advantage. If testing this model, use a
  # higher, quality-preserving quant instead (e.g. Unsloth's dynamic
  # UD-Q3_K_XL, ~16GB) — but note that alone already consumes this
  # hardware's entire 16GB VRAM budget, leaving no room for the
  # always-loaded swift (1.5GB) + embedding (0.3GB) models. qwen3-coder:30b
  # at 13GB leaves ~1.2GB of headroom for both, which is why it stays the
  # default here.
  code:
    model: qwen3-coder:30b
    tier: quality
    vram_gb: 13
    # Real: 41.9s latency, 41.1 tok/s, 15.2GB VRAM + 6.1GB RAM offload
    # (HOS-065C benchmark) — this model's 18GB on-disk weight already
    # exceeds the 17.16GB card before any context is added, so *some* RAM
    # offload is a hardware ceiling here regardless of num_ctx (see the
    # top-of-file note). 24576 (3x the old default) still helps real code
    # tasks read more of a file without making the offload categorically
    # worse than it already is at any context.
    num_ctx: 24576
    description: Code analysis, generation, refactoring (MoE, ~3B active params).

  code_agentic:
    model: devstral
    tier: quality
    vram_gb: 14
    # Real: 49.6s latency, 14.5 tok/s, 14.3GB VRAM, 0 RAM offload (HOS-065C
    # benchmark) — fits entirely in VRAM at 24576 with ~2.8GB headroom.
    num_ctx: 24576
    description: Agentic coding fallback, trained for autonomous file editing.

  reasoning:
    model: deepseek-r1:14b
    tier: quality
    vram_gb: 9
    # Real: 23.6s latency, 47.7 tok/s, 13.5GB VRAM, 0 RAM offload
    # (HOS-065C benchmark) — comfortable at 24576, ~3.6GB headroom.
    num_ctx: 24576
    description: Chain-of-thought reasoning, verification (Veritas).

  reasoning_escalation:
    model: deepseek-r1:32b
    tier: powerful
    vram_gb: 16
    ram_offload_gb: 8
    # Real: 95.8s latency, 6.6 tok/s, 15.0GB VRAM + 9.5GB RAM offload — at
    # only 16384 (HOS-065C benchmark), a fraction of the model's real max
    # (131072). This 19GB-on-disk model was already the tightest fit on
    # this card; raising context further only makes the offload (and the
    # 14x latency penalty already visible here vs. reasoning's 14B sibling)
    # worse, so this stays at the pre-HOS-065C default rather than being
    # raised like every other role — an "optimal" context here is smaller,
    # not bigger, given what escalating to this role already costs.
    num_ctx: 8192
    description: Deep reasoning escalation, offload expected.

  vision:
    model: gemma4:12b
    tier: quality
    vram_gb: 7.6
    # Real: 23.8s latency, 48.4 tok/s, 8.4GB VRAM, 0 RAM offload
    # (HOS-065C benchmark) — comfortable, ~8.7GB headroom.
    num_ctx: 16384
    description: >
      Multimodal image/screenshot analysis (Hermes Eyes). Upgraded from
      gemma3:12b (2026-07): encoder-free multimodal architecture (image/
      audio fed straight into the LLM backbone), released 2026-06-03,
      confirmed available in Ollama's official library. ~7.6GB at
      Q4_K_M — lighter than gemma3:12b's own footprint, verified via
      independent VRAM benchmarks, not just vendor marketing.

  security:
    model: phi4-reasoning:14b-q4_K_M
    tier: quality
    vram_gb: 11
    # Real: 48.7s latency, 38.6 tok/s, 14.3GB VRAM, 0 RAM offload
    # (HOS-065C benchmark) — fits but tight (~2.8GB headroom), and this
    # model's own real max is only 32768 (smallest ceiling of the large
    # models), so 16384 is not pushed further.
    num_ctx: 16384
    description: >
      Structured logical analysis, permission audit (Aegis). Upgraded from
      phi4:14b (2026-07): Microsoft's reasoning-tuned variant, SFT-trained
      on OpenAI o3-mini reasoning traces for complex structured reasoning
      — a closer match for Aegis's job than the base chat model. Confirmed
      on Ollama's official library (`phi4-reasoning:14b-q4_K_M`), 11GB,
      32K context.

  embedding:
    model: nomic-embed-text
    tier: turbo
    vram_gb: 0.3
    always_loaded: true
    # This model's real max context is only 2048 (`ollama show
    # nomic-embed-text`) — the pre-HOS-065C global default (8192) exceeded
    # what it actually supports for every embedding call made in this
    # deployment's lifetime. Set to its real ceiling, not a guess.
    num_ctx: 2048
    description: Text embeddings for RAG. Kept loaded at all times.

  double_check:
    model: qwen3:4b
    tier: turbo
    vram_gb: 3
    # Real: 8.7s latency, 129.5 tok/s, 5.1GB VRAM (HOS-065C benchmark) —
    # comfortable for a role meant to stay cheap.
    num_ctx: 16384
    description: Cheap parallel verification pass.

  advanced_analysis:
    model: gpt-oss:20b
    tier: powerful
    vram_gb: 14
    # Real: 24.7s latency, 93.4 tok/s, 12.7GB VRAM, 0 RAM offload
    # (HOS-065C benchmark) — comfortable, ~4.4GB headroom; rare-escalation
    # role, not hot path.
    num_ctx: 16384
    description: Rare escalation for strategic/complex analysis.

# Routing matrix: task_type -> ordered candidate roles (first = default).
# The router walks this list and picks the first role whose model is
# already loaded or fits in currently available VRAM.
routing:
  conversation: [standard, swift, orchestrator]
  classification: [swift]
  writing: [standard, orchestrator]
  summary_short: [swift, standard]
  summary_long: [standard, orchestrator]
  code_analysis: [code, standard]
  code_generation: [code, code_agentic]
  code_refactor: [code, reasoning]
  reasoning: [reasoning, orchestrator, reasoning_escalation]
  extraction: [standard, swift]
  research: [standard, orchestrator]
  planning: [orchestrator, standard]
  verification: [reasoning, security, reasoning_escalation]
  embedding: [embedding]
  rephrase: [standard, swift]
  vision: [vision]

# Generation parameters by context sensitivity (see cahier des charges §22.2).
generation_defaults:
  critical:
    temperature: 0.2
    top_p: 0.9
  standard:
    temperature: 0.6
    top_p: 0.95
  creative:
    temperature: 0.85
    top_p: 0.95

# Reasoning ("think") per task type — §22.1.
#
# Measured on RX 6800 with qwen3.5:9b, model warm, same prompt:
#   think=False -> 675 / 705 / 697 ms to the first *content* token
#   think=True  -> 4 223 / 4 405 ms
# The first token of any kind arrives in ~660 ms either way; the gap is
# entirely the reasoning phase, which chat_stream does not yield — so the
# user sees nothing for ~3.5 s. The Tier 2 budget is 3 s (§22.1), which
# is why T3 was failing.
#
# Reasoning is kept where it changes the answer (code, planning,
# verification, security) and dropped where it only adds silence
# (conversation, classification, extraction). The resolved value is
# carried on the RoutingDecision and recorded in the audit log, so a task
# type missing from this map is visible rather than silently downgraded.
thinking:
  default: false
  by_task_type:
    reasoning: true
    verification: true
    planning: true
    code_analysis: true
    code_generation: true
    code_refactor: true
