# Model catalogue and routing configuration for Hermes Ollama.
#
# This file is the single source of truth for which Ollama model tag is used
# for which role. Nothing in backend code should hardcode a model name —
# always resolve it through this file (see backend/core/router.py).
#
# Sizes/VRAM figures are indicative (Q4 quantization, RX 6800 16 GB target).
# Verify actual tag availability with `ollama show <model>` before pulling.

roles:
  swift:
    model: qwen3:1.7b
    tier: turbo
    vram_gb: 1.5
    # always_loaded pins this model in VRAM (keep_alive: -1) instead of
    # letting it expire after OLLAMA_KEEP_ALIVE (§22: "conserve les
    # modèles rapides en mémoire"). Structured flag rather than inferring
    # it from `tier: turbo` — double_check is turbo too but is genuinely
    # occasional, and pinning a third model would eat headroom the 16GB
    # budget doesn't have.
    always_loaded: true
    description: Ultra-fast routing and classification. Kept loaded at all times.

  standard:
    model: qwen3.5:9b
    tier: standard
    vram_gb: 6.6
    description: >
      General conversation, writing, extraction. Upgraded from qwen3:8b
      (2026-07): confirmed on Ollama's official library (`qwen3.5:9b`),
      6.6GB, 256K context window (up from qwen3:8b's), reported gains in
      reasoning/maths/multilingual over qwen3:8b.

  orchestrator:
    model: hf.co/bartowski/NousResearch_Hermes-4-14B-GGUF:Q4_K_M
    tier: quality
    vram_gb: 9
    description: >
      Planning, decomposition, orchestration (Hermes Prime). Upgraded from
      hermes3:8b (2026-07): NousResearch's Hermes 4 14B, built on a
      Qwen3-14B base, adds hybrid reasoning and explicit structured
      `<tool_call>` tagging after the reasoning step — directly relevant
      here since reliable tool/function calling is the exact reason this
      role exists as a separate model from `standard`. Not yet in Ollama's
      official library — pull the community GGUF conversion with
      `ollama pull hf.co/bartowski/NousResearch_Hermes-4-14B-GGUF:Q4_K_M`.
      vram_gb is an estimate for a 14B dense model at Q4_K_M (~9GB);
      confirm the exact figure with `ollama show` after pulling, since
      there's no official Ollama library page to cross-check against.

  # Optional alternative for `code`, not applied as default (2026-07 check):
  # Qwen3.6-35B-A3B beats qwen3-coder:30b on coding benchmarks (SWE-bench
  # Verified 73.4, Terminal-Bench 2.0 51.5) — but only at full precision.
  # The user's proposed Q2_K quant was rejected: 2-bit quantization hits
  # code generation disproportionately hard (MoE expert-routing distortion,
  # keyword/special-token imbalance), independently confirmed to erase or
  # reverse a full-precision advantage. If testing this model, use a
  # higher, quality-preserving quant instead (e.g. Unsloth's dynamic
  # UD-Q3_K_XL, ~16GB) — but note that alone already consumes this
  # hardware's entire 16GB VRAM budget, leaving no room for the
  # always-loaded swift (1.5GB) + embedding (0.3GB) models. qwen3-coder:30b
  # at 13GB leaves ~1.2GB of headroom for both, which is why it stays the
  # default here.
  code:
    model: qwen3-coder:30b
    tier: quality
    vram_gb: 13
    description: Code analysis, generation, refactoring (MoE, ~3B active params).

  code_agentic:
    model: devstral
    tier: quality
    vram_gb: 14
    description: Agentic coding fallback, trained for autonomous file editing.

  reasoning:
    model: deepseek-r1:14b
    tier: quality
    vram_gb: 9
    description: Chain-of-thought reasoning, verification (Veritas).

  reasoning_escalation:
    model: deepseek-r1:32b
    tier: powerful
    vram_gb: 16
    ram_offload_gb: 8
    description: Deep reasoning escalation, offload expected.

  vision:
    model: gemma4:12b
    tier: quality
    vram_gb: 7.6
    description: >
      Multimodal image/screenshot analysis (Hermes Eyes). Upgraded from
      gemma3:12b (2026-07): encoder-free multimodal architecture (image/
      audio fed straight into the LLM backbone), released 2026-06-03,
      confirmed available in Ollama's official library. ~7.6GB at
      Q4_K_M — lighter than gemma3:12b's own footprint, verified via
      independent VRAM benchmarks, not just vendor marketing.

  security:
    model: phi4-reasoning:14b-q4_K_M
    tier: quality
    vram_gb: 11
    description: >
      Structured logical analysis, permission audit (Aegis). Upgraded from
      phi4:14b (2026-07): Microsoft's reasoning-tuned variant, SFT-trained
      on OpenAI o3-mini reasoning traces for complex structured reasoning
      — a closer match for Aegis's job than the base chat model. Confirmed
      on Ollama's official library (`phi4-reasoning:14b-q4_K_M`), 11GB,
      32K context.

  embedding:
    model: nomic-embed-text
    tier: turbo
    vram_gb: 0.3
    always_loaded: true
    description: Text embeddings for RAG. Kept loaded at all times.

  double_check:
    model: qwen3:4b
    tier: turbo
    vram_gb: 3
    description: Cheap parallel verification pass.

  advanced_analysis:
    model: gpt-oss:20b
    tier: powerful
    vram_gb: 14
    description: Rare escalation for strategic/complex analysis.

# Routing matrix: task_type -> ordered candidate roles (first = default).
# The router walks this list and picks the first role whose model is
# already loaded or fits in currently available VRAM.
routing:
  conversation: [standard, swift, orchestrator]
  classification: [swift]
  writing: [standard, orchestrator]
  summary_short: [swift, standard]
  summary_long: [standard, orchestrator]
  code_analysis: [code, standard]
  code_generation: [code, code_agentic]
  code_refactor: [code, reasoning]
  reasoning: [reasoning, orchestrator, reasoning_escalation]
  extraction: [standard, swift]
  research: [standard, orchestrator]
  planning: [orchestrator, standard]
  verification: [reasoning, security, reasoning_escalation]
  embedding: [embedding]
  rephrase: [standard, swift]
  vision: [vision]

# Generation parameters by context sensitivity (see cahier des charges §22.2).
generation_defaults:
  critical:
    temperature: 0.2
    top_p: 0.9
  standard:
    temperature: 0.6
    top_p: 0.95
  creative:
    temperature: 0.85
    top_p: 0.95
