# Model catalogue and routing configuration for Hermes Ollama.
#
# This file is the single source of truth for which Ollama model tag is used
# for which role. Nothing in backend code should hardcode a model name —
# always resolve it through this file (see backend/core/router.py).
#
# ── 2026-08-15 (HOS-108): every role but `embedding` pointed at a tag that
# no longer existed. ────────────────────────────────────────────────────────
#
# The model cleanup renamed 21 tags down to 11, baking each model's real
# served context into its name, and this file was never updated. Ollama
# answered `/api/chat` with 404 for every role; `/chat` returned HTTP 200
# with an empty stream, so the Assistant tab showed silence rather than an
# error. Eight tests in test_chat_audit.py had been reporting it for hours
# and were dismissed as machine contention until the suite was finally run
# on an idle machine.
#
# Every figure below now comes from a campaign in this repository —
# backend/model_intelligence/, results in the bench store, visible in the
# Models tab. Nothing here is extrapolated, and nothing is a vendor claim.
#
#   model                 VRAM     ctx    tok/s   code  agent  reason  vision
#   gpt-oss-20b-64k      13.03G    64k     94.1    100   3/3   4/4 85s    —
#   qwen3.6-35b-128k     13.68G   128k     89.3     88   3/3   4/4 114s  3/3
#   muse-glimmer-64k     13.06G    64k     27.9     94   3/3   4/4 188s   —
#   ornith-9b-256k       13.50G   256k     68.2     36   3/3   4/4 125s  3/3
#   gemma4-12b-256k      12.24G   256k     48.8     36   3/3   4/4 426s  3/3
#   lfm2.5-2.6b-125k      2.05G    16k    187.6     28   3/3   3/4       —
#   qwen3-embedding:0.6b   0.6G     2k       —       —    —      —        —
#
# VRAM is the real figure read from the inference process's GPU counter,
# not `/api/ps` — that endpoint reports the weights only and understates
# the total by several GB, always in the direction that makes a second
# model look loadable when it is not.
#
# ── `always_loaded` asks for more than the runtime grants ──────────────────
#
# The flag sends `keep_alive: -1`, which stops a model expiring for
# idleness. It does not survive another model being requested:
# OLLAMA_MAX_LOADED_MODELS is 1 on this machine, so exactly one model is
# resident at a time and every role switch evicts the previous one.
#
# The flag is kept, not deleted. §22 ("conserve les modèles rapides en
# mémoire") is a real requirement, test_always_loaded_models.py guards it,
# and the setting is one environment variable away. What was wrong was
# reading this file as though swift and the embedding model were warm.
#
# backend/runtime/model_guard.py now reports the contradiction at startup
# rather than leaving it to a comment nobody rereads.
#
# Raising the limit needs this arithmetic, measured on 15.5 GiB of usable
# VRAM: swift at 16k costs 2.05 GiB and the embedding model 0.6, leaving
# 12.85 — which is 0.18 GiB less than gpt-oss needs at 64k. Two of the
# three fit; three do not.
#
# ── One consequence to settle in the routing pass ──────────────────────────
#
# The router's first rule is "a model already in VRAM wins, regardless of
# tier preference order". On one resident model that rule means the last
# task's model answers the next one whenever it is a valid candidate — so
# an `extraction` served by swift leaves swift resident, and the following
# `conversation` gets the 2.6B model instead of `standard`, recorded only
# as reason "already loaded".
#
# That is a real trade (a reload costs 11-27 s, measured) and not obviously
# wrong, but it is currently implicit and quality-affecting. It belongs to
# the routing pass, with the measured scores above to arbitrate it — not to
# a silent edit here.

roles:
  swift:
    model: lfm2.5-2.6b-125k
    tier: turbo
    # 2.05 GiB measured at this num_ctx, 0 % CPU offload, 187.6 tok/s — the
    # fastest model in the catalogue and the cheapest that still scores
    # 3/3 agentic and 100 on extraction. 16k rather than its full 125k:
    # the ladder shows 1.75 GiB at 4k and 2.33 at 32k, and routing and
    # classification never need the room.
    vram_gb: 2.05
    always_loaded: true
    num_ctx: 16384
    description: Ultra-fast routing and classification.

  standard:
    model: ornith-9b-256k
    tier: standard
    # 13.50 GiB at its full 256k, 0 % offload, 68.2 tok/s. Agentic 3/3 with
    # the artefact verified on disk, reasoning 4/4 in 125 s, long context
    # 5/6. Weak at code (36) — which is why `code` is a separate role.
    vram_gb: 13.5
    num_ctx: 262144
    description: General conversation, writing, extraction.

  orchestrator:
    model: gpt-oss-20b-64k
    tier: quality
    # Agentic 3/3, every attempt calling two tools and leaving a file that
    # was then verified on disk rather than trusted from the transcript.
    # Fastest of the large models at 94.1 tok/s, which matters for a role
    # that runs on every decomposition.
    vram_gb: 13.03
    num_ctx: 65536
    description: Planning, decomposition, orchestration (Hermes Prime).

  code:
    model: gpt-oss-20b-64k
    tier: quality
    # 100/100. The only model to pass all six tie-break epreuves: building
    # an interpreter, an O(1) LRU under a stopwatch, a bounded queue safe
    # across threads, a provably minimal diff, a lazily-propagated segment
    # tree, and a persistent map that neither copies per version nor walks
    # its history per read. muse-glimmer scores 94, qwen3.6 88.
    vram_gb: 13.03
    num_ctx: 65536
    description: Code analysis, generation, refactoring.

  code_agentic:
    model: gpt-oss-20b-64k
    tier: quality
    # Same model as `code` on purpose. It wins both axes, and with one
    # resident model at a time, a second tag here would buy nothing but
    # reload latency on the hot path.
    vram_gb: 13.03
    num_ctx: 65536
    description: Agentic coding, autonomous file editing.

  reasoning:
    model: qwen3.6-35b-128k
    tier: quality
    # 4/4 on the reasoning axis in 114 s, 128k served at 0 % offload,
    # 89.3 tok/s — and 34.7B parameters that fit only because 3B are active
    # per token. Vision 3/3 as a bonus the role does not require.
    vram_gb: 13.68
    num_ctx: 131072
    description: Chain-of-thought reasoning, verification (Veritas).

  reasoning_escalation:
    model: muse-glimmer-64k
    tier: powerful
    # Code 94, reasoning 4/4, long context 6/6 — but 27.9 tok/s, the
    # slowest model kept, and 188 s on the same four reasoning epreuves
    # gpt-oss finishes in 85. Genuinely an escalation: correct and
    # expensive, not a default.
    vram_gb: 13.06
    num_ctx: 65536
    description: Deep reasoning escalation. Slow by design, use sparingly.

  vision:
    model: gemma4-12b-256k
    tier: quality
    # Vision 3/3 on images whose content is generated and therefore known
    # exactly — OCR of a random code, counting shapes, locating a rectangle.
    # 12.24 GiB, the lightest of the large models.
    #
    # Its 256k is unusable for long documents: 2/6 on the needle probe, and
    # 611 s for a single 32k retrieval. Do not route long-context work here
    # on the strength of the context number alone.
    vram_gb: 12.24
    num_ctx: 262144
    description: Multimodal image/screenshot analysis (Hermes Eyes).

  security:
    model: qwen3.6-35b-128k
    tier: quality
    # Reasoning 4/4. Aegis's job is structured logical analysis, which is
    # the axis measured, and sharing the tag with `reasoning` avoids a
    # reload when a verification follows a reasoning step.
    vram_gb: 13.68
    num_ctx: 131072
    description: Structured logical analysis, permission audit (Aegis).

  embedding:
    model: qwen3-embedding:0.6b
    tier: turbo
    vram_gb: 0.6
    always_loaded: true
    # The only embedding model installed. 2048 is deliberate: raising
    # OLLAMA_CONTEXT_LENGTH to 65536 for the agent once took this model
    # from 0.64 GB to 5.88 GB of VRAM and 57 s per call.
    num_ctx: 2048
    description: Text embeddings for RAG.

  double_check:
    model: lfm2.5-2.6b-125k
    tier: turbo
    # The same tag as `swift`, so a verification pass costs no reload. 187.6
    # tok/s and 100 on extraction; its 3/4 in reasoning — it answers 1 to
    # the trap where the answer is 5 — is acceptable for a second opinion
    # and is the reason it is not the primary reasoning role.
    vram_gb: 2.05
    num_ctx: 16384
    description: Cheap parallel verification pass.

  advanced_analysis:
    model: qwen3.6-35b-128k
    tier: powerful
    # 128k served at 0 % offload with vision 3/3 and long context 6/6 —
    # the widest real window in the catalogue among models that also score
    # on competence rather than only on context length.
    vram_gb: 13.68
    num_ctx: 131072
    description: Rare escalation for strategic/complex analysis.

# Routing matrix: task_type -> ordered candidate roles (first = default).
# The router walks this list and picks the first role whose model is
# already loaded or fits in currently available VRAM.
routing:
  conversation: [standard, swift, orchestrator]
  classification: [swift]
  writing: [standard, orchestrator]
  summary_short: [swift, standard]
  summary_long: [standard, orchestrator]
  code_analysis: [code, standard]
  code_generation: [code, code_agentic]
  code_refactor: [code, reasoning]
  reasoning: [reasoning, orchestrator, reasoning_escalation]
  extraction: [swift, standard]
  research: [standard, orchestrator]
  planning: [orchestrator, standard]
  verification: [reasoning, security, reasoning_escalation]
  embedding: [embedding]
  rephrase: [swift, standard]
  vision: [vision]

# `extraction` and `rephrase` now lead with `swift` rather than `standard`.
# Measured: nine models out of ten reach the top extraction level, so the
# axis does not discriminate on competence and the only real difference is
# cost. lfm2.5 answers an extraction in 4.4 s where muse-glimmer takes
# 13.3 — same verdict, a third of the time.

# Generation parameters by context sensitivity (see cahier des charges §22.2).
generation_defaults:
  critical:
    temperature: 0.2
    top_p: 0.9
  standard:
    temperature: 0.6
    top_p: 0.95
  creative:
    temperature: 0.85
    top_p: 0.95

# Reasoning ("think") per task type — §22.1.
#
# Measured on RX 6800 with qwen3.5:9b, model warm, same prompt:
#   think=False -> 675 / 705 / 697 ms to the first *content* token
#   think=True  -> 4 223 / 4 405 ms
# The first token of any kind arrives in ~660 ms either way; the gap is
# entirely the reasoning phase, which chat_stream does not yield — so the
# user sees nothing for ~3.5 s. The Tier 2 budget is 3 s (§22.1), which
# is why T3 was failing.
#
# Reasoning is kept where it changes the answer (code, planning,
# verification, security) and dropped where it only adds silence
# (conversation, classification, extraction). The resolved value is
# carried on the RoutingDecision and recorded in the audit log, so a task
# type missing from this map is visible rather than silently downgraded.
#
# The model this was measured on no longer exists; the numbers are kept
# because the mechanism they describe — reasoning is silence, and silence
# has a budget — is a property of the streaming path, not of that model.
thinking:
  default: false
  by_task_type:
    reasoning: true
    verification: true
    planning: true
    code_analysis: true
    code_generation: true
    code_refactor: true
